<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23405e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2323405e'/%3E%3Cg fill='%23e9e5d8'%3E%3Ccircle cx='45' cy='16' r='5'/%3E%3Ccircle cx='41' cy='27' r='4'/%3E%3Ccircle cx='34' cy='36' r='4'/%3E%3Ccircle cx='26' cy='43' r='4'/%3E%3Ccircle cx='17' cy='49' r='3.5'/%3E%3C/g%3E%3C/svg%3E">
<title>国内観光地理マップ｜旅行業務取扱管理者</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sumi:#191d23; --ai:#23405e; --ai2:#3a6690;
  --washi:#e9e5d8; --washi2:#f4f1e8; --line:#cdc6b2; --mute:#6d6857;
  --c-o:#c05a37; --c-m:#a52e48; --c-p:#2c6b4d; --c-w:#3c56a0;
  --c-c:#5c4b8b; --c-s:#8a6524; --c-a:#17707d; --c-f:#7a2f5e;
  --ok:#2c6b4d; --ng:#a52e48;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--washi);color:var(--sumi);
  font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
  font-size:15px;line-height:1.72;padding-bottom:48px;
  background-image:radial-gradient(rgba(120,110,80,.05) 1px,transparent 1px);
  background-size:4px 4px;
}
.wrap{max-width:780px;margin:0 auto;padding:0 14px}
header{background:var(--ai);color:var(--washi2);padding:16px 0 14px;margin-bottom:12px;border-bottom:3px solid var(--sumi);padding-top:calc(16px + env(safe-area-inset-top))}
.wrap{padding-left:calc(14px + env(safe-area-inset-left));padding-right:calc(14px + env(safe-area-inset-right))}
header h1{font-family:"Zen Old Mincho",serif;font-weight:900;font-size:1.42rem;letter-spacing:.14em;margin:0;line-height:1.35}
header .sub{font-size:.7rem;letter-spacing:.2em;color:#a9bdd2;margin-top:4px}

.tabs{display:flex;border:1.5px solid var(--sumi);border-radius:3px;overflow:hidden;margin-bottom:12px}
.tabs button{flex:1;border:0;background:var(--washi2);color:var(--mute);font-family:inherit;font-size:.8rem;font-weight:700;letter-spacing:.06em;padding:10px 2px;cursor:pointer;border-right:1px solid var(--line)}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{background:var(--sumi);color:var(--washi2)}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chip{border:1.5px solid var(--line);background:var(--washi2);border-radius:999px;padding:4px 11px;font-size:.75rem;font-weight:500;font-family:inherit;color:var(--mute);cursor:pointer;display:flex;align-items:center;gap:5px}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip[aria-pressed="true"]{background:var(--sumi);color:var(--washi2);border-color:var(--sumi)}
.chip.o[aria-pressed="true"]{background:var(--c-o);border-color:var(--c-o)}
.chip.m[aria-pressed="true"]{background:var(--c-m);border-color:var(--c-m)}
.chip.p[aria-pressed="true"]{background:var(--c-p);border-color:var(--c-p)}
.chip.w[aria-pressed="true"]{background:var(--c-w);border-color:var(--c-w)}
.chip.c[aria-pressed="true"]{background:var(--c-c);border-color:var(--c-c)}
.chip.s[aria-pressed="true"]{background:var(--c-s);border-color:var(--c-s)}
.chip.a[aria-pressed="true"]{background:var(--c-a);border-color:var(--c-a)}
.chip.f[aria-pressed="true"]{background:var(--c-f);border-color:var(--c-f)}
.chip.sm{font-size:.72rem;padding:3px 9px}

.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 8px;font-size:.74rem;color:var(--mute)}
.toolbar .pg{margin-left:auto;letter-spacing:.08em}
.toolbar .pg b{font-family:"Zen Old Mincho",serif;font-size:1rem;color:var(--sumi)}

.mapbox{position:relative;width:100%;aspect-ratio:1/1.02;background:var(--washi2);border:1.5px solid var(--sumi);border-radius:4px;container-type:inline-size;overflow:hidden;box-shadow:3px 3px 0 rgba(25,29,35,.13);scroll-margin-top:8px}
.pref{position:absolute;transform:translate(-50%,-50%);width:10%;height:4.6%;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--sumi);font-size:2.9cqw;font-weight:700;letter-spacing:-.02em;cursor:pointer;transition:transform .12s ease;padding:0;font-family:inherit;line-height:1;white-space:nowrap}
.pref:hover{transform:translate(-50%,-50%) scale(1.15);z-index:5}
.pref:focus-visible{outline:2px solid var(--ai2);outline-offset:2px;z-index:6}
.pref.sel{box-shadow:0 0 0 2.5px var(--sumi);z-index:4;transform:translate(-50%,-50%) scale(1.15)}
.pref.hit{box-shadow:0 0 0 2.5px var(--sumi);z-index:4}
.pref.dim{opacity:.22}
.pref.right{color:#fff;background:var(--ok)!important;box-shadow:0 0 0 2.5px var(--ok)}
.pref.wrong{color:#fff;background:var(--ng)!important;box-shadow:0 0 0 2.5px var(--ng)}
.pref .mark{position:absolute;top:-2px;right:-2px;width:1.8cqw;height:1.8cqw;border-radius:50%;background:var(--ai);border:.4cqw solid #fff}
body.blank .pref{color:transparent!important}
body.blank .pref.sel,body.blank .pref.right,body.blank .pref.wrong,body.blank .pref.hit{color:inherit!important}
.maplegend{font-size:.7rem;color:var(--mute);letter-spacing:.04em;margin:6px 0 0;display:flex;gap:8px;align-items:flex-start}
.maplegend button{margin-left:auto;flex-shrink:0;font-family:inherit;font-size:.7rem;border:1px solid var(--line);background:var(--washi2);border-radius:2px;padding:2px 8px;cursor:pointer;color:var(--mute)}

.search{width:100%;padding:10px 12px;font-family:inherit;font-size:.95rem;border:1.5px solid var(--sumi);border-radius:3px;background:var(--washi2);margin:10px 0 4px}
.search:focus{outline:2px solid var(--ai2);outline-offset:1px}

.panel{background:var(--washi2);border:1.5px solid var(--sumi);border-radius:4px;padding:14px 15px;margin-top:12px;box-shadow:3px 3px 0 rgba(25,29,35,.13)}
.panel h2{font-family:"Zen Old Mincho",serif;font-size:1.3rem;font-weight:900;margin:0 0 2px;letter-spacing:.1em}
.panel .region{font-size:.7rem;letter-spacing:.18em;color:var(--mute);margin-bottom:9px}
.nbr{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;padding-bottom:11px;border-bottom:1px dashed var(--line)}
.nbr span{font-size:.68rem;color:var(--mute);align-self:center;letter-spacing:.1em;margin-right:2px}
.nbr button{font-family:inherit;font-size:.75rem;border:1px solid var(--line);background:#fff;border-radius:2px;padding:2px 9px;cursor:pointer;color:var(--sumi)}
.nbr button:hover{border-color:var(--sumi)}

.detail{border:1.5px solid var(--sumi);border-left-width:5px;background:#fff;border-radius:3px;padding:11px 13px;margin-bottom:13px}
.detail .dn{font-family:"Zen Old Mincho",serif;font-size:1.06rem;font-weight:700;letter-spacing:.05em}
.detail .dc{font-size:.66rem;letter-spacing:.14em;color:#fff;padding:1px 7px;border-radius:2px;margin-left:7px;vertical-align:2px}
.detail .dnote{font-size:.85rem;margin-top:5px;line-height:1.75}
.dimg{margin-top:9px;border-radius:3px;overflow:hidden;border:1px solid var(--line);background:var(--washi);position:relative;min-height:0}
.dimg img{display:block;width:100%;height:170px;object-fit:cover}
.dimg figcaption{font-size:.66rem;color:var(--mute);padding:3px 7px;background:var(--washi2);letter-spacing:.04em}
.dimg.loading{height:170px;display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--mute)}
.imglink{display:inline-block;margin-top:8px;font-size:.75rem;font-family:inherit;border:1px solid var(--line);background:var(--washi);border-radius:2px;padding:4px 10px;color:var(--sumi);text-decoration:none;cursor:pointer}
.imglink:hover{border-color:var(--sumi)}
.detail .dpref{font-size:.78rem;color:var(--mute);margin-top:6px}
.detail .dgrp{margin-top:9px;padding-top:8px;border-top:1px dotted var(--line);font-size:.8rem}
.detail .dgrp b{font-family:"Zen Old Mincho",serif;letter-spacing:.06em}
.detail .dgrp .gi{display:inline-block;margin:3px 5px 0 0;padding:2px 8px;background:var(--washi);border-radius:2px;cursor:pointer;font-size:.78rem}
.detail .dgrp .gi.cur{background:var(--sumi);color:var(--washi2)}

.grp{margin-bottom:10px}
.grp:last-child{margin-bottom:0}
.grp h3{font-size:.66rem;font-weight:700;letter-spacing:.14em;margin:0 0 5px;display:inline-block;padding:2px 8px;border-radius:2px;color:#fff}
.grp.o h3{background:var(--c-o)} .grp.m h3{background:var(--c-m)} .grp.p h3{background:var(--c-p)}
.grp.w h3{background:var(--c-w)} .grp.c h3{background:var(--c-c)} .grp.s h3{background:var(--c-s)}
.grp.a h3{background:var(--c-a)} .grp.f h3{background:var(--c-f)}
.items{display:flex;flex-wrap:wrap;gap:5px}
.item{font-size:.82rem;background:#fff;border:1px solid var(--line);border-radius:2px;padding:3px 8px;cursor:pointer;font-family:inherit;color:var(--sumi);position:relative}
.item:hover{border-color:var(--sumi)}
.item.on{background:var(--sumi);color:var(--washi2);border-color:var(--sumi)}
.item.hasnote::after{content:"";position:absolute;top:2px;right:2px;width:4px;height:4px;border-radius:50%;background:var(--ai2)}
.item.on.hasnote::after{background:var(--washi2)}
.empty{color:var(--mute);font-size:.8rem}
.done{margin-top:13px;padding-top:11px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--mute)}
.done button{font-family:inherit;font-size:.78rem;font-weight:700;padding:5px 12px;border:1.5px solid var(--sumi);background:var(--washi2);border-radius:2px;cursor:pointer}
.done button[aria-pressed="true"]{background:var(--ai);color:#fff;border-color:var(--ai)}

.qcard{background:var(--ai);color:var(--washi2);border:1.5px solid var(--sumi);border-radius:4px;padding:15px;margin-bottom:11px;box-shadow:3px 3px 0 rgba(25,29,35,.2)}
.qmeta{font-size:.66rem;letter-spacing:.16em;color:#a9bdd2;margin-bottom:6px}
.qtext{font-family:"Zen Old Mincho",serif;font-size:1.2rem;font-weight:700;line-height:1.55;letter-spacing:.04em}
.qhint{font-size:.76rem;color:#a9bdd2;margin-top:7px}
.choices{display:grid;gap:7px;margin-top:10px}
.choices button{font-family:inherit;font-size:.92rem;font-weight:500;text-align:left;padding:11px 13px;border:1.5px solid var(--sumi);background:var(--washi2);border-radius:3px;cursor:pointer;color:var(--sumi)}
.choices button.right{background:var(--ok);color:#fff;border-color:var(--ok)}
.choices button.wrong{background:var(--ng);color:#fff;border-color:var(--ng)}
.feedback{margin-top:11px;padding:12px 13px;border-radius:3px;font-size:.88rem;border:1.5px solid var(--sumi);background:var(--washi2)}
.feedback b{font-family:"Zen Old Mincho",serif;letter-spacing:.06em}
.feedback .fnote{font-size:.83rem;margin-top:6px}
.feedback .fchain{font-size:.79rem;color:var(--mute);margin-top:7px;padding-top:7px;border-top:1px dotted var(--line)}
.score{display:flex;gap:14px;font-size:.76rem;color:var(--mute);letter-spacing:.08em;margin-bottom:9px}
.score b{font-size:1.12rem;color:var(--sumi);font-family:"Zen Old Mincho",serif}
.btnrow{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.btn{font-family:inherit;font-size:.85rem;font-weight:700;padding:9px 18px;border:1.5px solid var(--sumi);background:var(--sumi);color:var(--washi2);border-radius:2px;cursor:pointer;letter-spacing:.05em}
.btn.ghost{background:var(--washi2);color:var(--sumi)}

.section{margin-bottom:20px}
.section>h2{font-family:"Zen Old Mincho",serif;font-size:1.02rem;font-weight:900;letter-spacing:.13em;margin:0 0 3px;padding-bottom:5px;border-bottom:2px solid var(--sumi)}
.section .note{font-size:.74rem;color:var(--mute);margin:6px 0 9px}
.row{display:flex;gap:9px;align-items:baseline;padding:6px 8px;border-bottom:1px dotted var(--line);cursor:pointer;font-size:.86rem}
.row:hover{background:var(--washi2)}
.row .num{font-family:"Zen Old Mincho",serif;font-size:.7rem;color:var(--mute);min-width:24px;text-align:right;flex-shrink:0}
.row .pf{font-size:.71rem;color:var(--mute);margin-left:auto;text-align:right;flex-shrink:0;padding-left:8px}
.trio{background:var(--washi2);border:1.5px solid var(--sumi);border-radius:4px;padding:11px 13px;margin-bottom:8px;cursor:pointer}
.trio h3{font-family:"Zen Old Mincho",serif;font-size:.96rem;margin:0 0 3px;letter-spacing:.09em}
.trio p{margin:0;font-size:.84rem;line-height:1.8}
.trio .tip{font-size:.74rem;color:var(--mute);margin-top:4px}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header><div class="wrap">
  <h1>国内観光地理マップ</h1>
  <div class="sub">47都道府県 × 8分野　温泉・祭り・国立公園・世界遺産・城・名所・空港・食</div>
</div></header>

<div class="wrap">
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="map">地図で覚える</button>
    <button role="tab" aria-selected="false" data-tab="quiz">クイズ</button>
    <button role="tab" aria-selected="false" data-tab="list">横断まとめ</button>
  </div>

  <section id="tab-map">
    <div class="chips" id="chips"></div>
    <div class="chips" id="regchips"></div>
    <div class="toolbar">
      <label><input type="checkbox" id="blank"> 白地図モード</label>
      <label><input type="checkbox" id="photo" checked> 写真を表示</label>
      <span class="pg">覚えた <b id="pgN">0</b> / 47</span>
    </div>
    <div class="mapbox" id="mapbox"></div>
    <div class="maplegend"><span id="legend">都道府県をタップすると詳細が出ます</span><button id="clearHl" class="hidden">解除</button></div>
    <input class="search" id="search" type="search" placeholder="検索（例：草津／ねぶた／現存天守／KMJ／カルデラ）">
    <div id="panel"></div>
  </section>

  <section id="tab-quiz" class="hidden">
    <div class="chips" id="qchips"></div>
    <div class="score"><span>正解 <b id="sOk">0</b></span><span>出題 <b id="sAll">0</b></span><span>正答率 <b id="sPct">—</b></span></div>
    <div class="qcard">
      <div class="qmeta" id="qmeta">QUESTION</div>
      <div class="qtext" id="qtext">準備中…</div>
      <div class="qhint" id="qhint"></div>
    </div>
    <div class="mapbox hidden" id="qmapbox"></div>
    <div class="choices" id="qchoices"></div>
    <div id="qfeedback"></div>
    <div class="btnrow">
      <button class="btn" id="qnext">次の問題</button>
      <button class="btn ghost" id="qreset">成績をリセット</button>
    </div>
  </section>

  <section id="tab-list" class="hidden"><div id="listbody"></div></section>
</div>

<script>
/* ============================================================
   データ　「名称|解説」形式。解説は覚えるためのフックのみ。
   o温泉 m祭り p国立公園 w世界遺産 c城・史跡 s名所景勝 a空港 f食・特産
   ============================================================ */
const P=[
["北海道","北海道",86,4,{
o:["登別|地獄谷。9種の泉質が湧く温泉のデパート","定山渓|札幌の奥座敷","層雲峡|大雪山の柱状節理の峡谷","洞爺|有珠山・昭和新山の麓","川湯|強酸性硫黄泉。屈斜路湖畔","湯の川|函館の海辺","十勝川|世界的に希少なモール温泉（植物性）","ニセコ湯本"],
m:["さっぽろ雪まつり|2月・大通公園の大雪像","YOSAKOIソーラン祭り|6月"],
p:["利尻礼文サロベツ|海抜0mから高山植物が咲く","知床|流氷が育む食物連鎖","阿寒摩周|マリモと霧の摩周湖","釧路湿原|日本最大の湿原。タンチョウ","大雪山|日本最大の国立公園。「北海道の屋根」","日高山脈襟裳十勝|2024年指定。35番目で最新","支笏洞爺|支笏湖は日本最北の不凍湖"],
w:["知床〈自然〉|2005年。海と陸の生態系のつながりを評価","北海道・北東北の縄文遺跡群|2021年。北海道＋青森・岩手・秋田"],
c:["五稜郭|星形の稜堡式城郭。箱館戦争","松前城|北海道唯一の日本式城郭"],
s:["摩周湖|「霧の摩周湖」高い透明度","小樽運河","函館山の夜景","富良野・美瑛|ラベンダーと丘","旭山動物園|行動展示で有名"],
a:["新千歳|CTS・道内の玄関口","函館|HKD","旭川|AKJ","釧路|KUH","女満別|MMB・網走／知床方面","稚内|WKJ・日本最北"],
f:["ジンギスカン","石狩鍋","ちゃんちゃん焼き","毛ガニ・ホタテ","夕張メロン"]}],

["青森","東北",86,11,{
o:["酸ヶ湯|すかゆ。ヒバ千人風呂。国民保養温泉地 第1号","浅虫|陸奥湾の海辺","蔦|ブナ林の一軒宿"],
m:["青森ねぶた祭|8月・人形型ねぶたとハネト","弘前ねぷたまつり|8月・扇ねぷた","八戸三社大祭|7〜8月・ユネスコ"],
p:["十和田八幡平|十和田湖・奥入瀬渓流","三陸復興"],
w:["白神山地〈自然〉|1993年。世界最大級のブナ原生林","北海道・北東北の縄文遺跡群|三内丸山遺跡"],
c:["弘前城|現存天守12。桜の名所"],
s:["奥入瀬渓流|十和田湖から流れ出る唯一の川","十和田湖|二重カルデラ湖","恐山|日本三大霊場。イタコ","仏ヶ浦","八甲田山","竜飛崎"],
a:["青森|AOJ","三沢|MSJ"],
f:["大間のマグロ","けの汁","せんべい汁|八戸","りんご|生産量日本一"]}],

["秋田","東北",80,17,{
o:["乳頭温泉郷|鶴の湯の白濁湯","玉川|pH1.2の強酸性。日本一の湧出量の単一泉","後生掛|オンドル・箱蒸し"],
m:["秋田竿燈まつり|8月・稲穂に見立てた提灯","なまはげ柴灯まつり|2月・真山神社","角館祭りのやま行事|9月・ユネスコ","西馬音内の盆踊|8月・三大盆踊り。編笠と亡者踊り"],

function groupsOf(name){
  const b=bare(name);
  return GROUPS.filter(g=>g[1].some(x=>b.startsWith(x)||x.startsWith(b)&&b.length>1)).map(g=>g[0]);
}
function findItem(memberName){
  return ITEMS.find(it=>bare(it.name).startsWith(memberName)||memberName.startsWith(bare(it.name)));

function countFor(p){
  return activeCat==="all"?CATS.reduce((s,c)=>s+(p.d[c.k]||[]).length,0):(p.d[activeCat]||[]).length;

function paintMap(){
  const maxC=Math.max(...PREFS.map(countFor),1);
  const base=activeCat==="all"?"var(--ai)":CATCOLOR[activeCat];
  [...mapbox.children].forEach(b=>{
    const p=PREFS[+b.dataset.i],c=countFor(p),t=c/maxC;
    b.className="pref";
    b.style.background=c===0?"#fff":`color-mix(in srgb, ${base} ${Math.round(14+t*72)}%, #ffffff)`;
    b.style.color=t>.48?"#fff":"var(--sumi)";
    b.style.borderColor=c===0?"var(--line)":"transparent";
    if(selected===p.i)b.classList.add("sel");
    if(highlight){highlight.prefs.includes(p.i)?b.classList.add("hit"):b.classList.add("dim");}
    else if(activeRegion!=="all"&&p.region!==activeRegion)b.classList.add("dim");
    if(progress[p.n]){const m=document.createElement("span");m.className="mark";b.appendChild(m);}
  });
  document.getElementById("legend").textContent=
    highlight?`「${highlight.label}」→ ${highlight.prefs.map(i=>PREFS[i].n).join("・")||"該当なし"}`
    :(activeCat==="all"?"色が濃いほど掲載項目が多い県":`${CATMAP[activeCat].label}の分布（濃い＝多い）`);

}

const thumbCache=new Map();
function wikiTitle(it){
  let b=bare(it.name).split("・")[0].split("／")[0].trim();
  if(it.cat==="o"&&!/温泉/.test(b)) b+="温泉";
  if(it.cat==="p") b+=/〈国定〉/.test(it.name)?"国定公園":"国立公園";
  if(it.cat==="a"&&!/空港/.test(b)) b+="空港";
  const fix={"宮島":"厳島","江戸城跡":"江戸城","春日山城跡":"春日山城","安土城跡":"安土城",
    "名護屋城跡":"名護屋城","岡城跡":"岡城 (豊後国)","鶴丸城跡":"鹿児島城","平城宮跡":"平城宮",
    "東京国際空港":"東京国際空港","中部国際空港":"中部国際空港","阿蘇くまもと空港":"熊本空港"};
  return fix[b]||b;
}
async function fillThumb(fig){
  if(!document.getElementById("photo").checked){fig.remove();return;}
  const title=fig.dataset.thumb, q=fig.dataset.q;
  const fail=()=>{
    fig.classList.remove("loading");
    fig.outerHTML=`<a class="imglink" target="_blank" rel="noopener"
      href="https://www.google.com/search?tbm=isch&q=${q}">画像を検索して見る ↗</a>`;
  };
  try{
    let data=thumbCache.get(title);
    if(data===undefined){
      const r=await fetch("https://ja.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title));
      data=r.ok?await r.json():null;
      thumbCache.set(title,data);
    }
    const src=data&&(data.thumbnail&&data.thumbnail.source);
    if(!src){fail();return;}
    const img=new Image();
    img.onload=()=>{
      fig.classList.remove("loading");
      fig.innerHTML="";
      fig.appendChild(img);
      const cap=document.createElement("figcaption");
      cap.textContent=(data.titles&&data.titles.normalized||title)+"／Wikipedia";
      fig.appendChild(cap);
    };
    img.onerror=fail;
    img.src=src; img.alt=title;
  }catch(e){fail();}
}
const loadThumbs=root=>root.querySelectorAll(".dimg").forEach(fillThumb);

function detailHTML(it){
  const c=CATMAP[it.cat];

    const mem=GROUPS.find(x=>x[0]===gname)[1];
    g+=`<div class="dgrp"><b>${esc(gname)}</b><br>`+mem.map(mn=>{
      const t=findItem(mn);
      const pf=t?t.prefs.map(i=>PREFS[i].n).join("・"):"";
      const cur=t&&t.name===it.name?" cur":"";
      return `<span class="gi${cur}" data-jump="${esc(mn)}">${esc(mn)}${pf?`<span style="opacity:.65"> ${esc(pf)}</span>`:""}</span>`;
    }).join("")+`</div>`;
  });
  const q=encodeURIComponent(bare(it.name)+" "+PREFS[it.prefs[0]].n);
  return `<div class="detail" style="border-left-color:${CATCOLOR[it.cat]}">
    <div><span class="dn">${esc(it.name)}</span><span class="dc" style="background:${CATCOLOR[it.cat]}">${c.label}</span></div>

}
function renderPanel(){
  const el=document.getElementById("panel");
  if(selected===null&&!curItem){el.innerHTML="";return;}
  let html="";
  if(curItem) html+=`<div class="panel">${detailHTML(curItem)}`;
  if(selected!==null){
    const p=PREFS[selected];
    if(!curItem) html+=`<div class="panel">`;
    html+=`<h2>${p.n}</h2><div class="region">${p.region}地方</div>`;
    const nb=ADJ[p.n]||[];
    if(nb.length) html+=`<div class="nbr"><span>隣接</span>${nb.map(n=>`<button data-pref="${n}">${n}</button>`).join("")}</div>`;
    const cats=activeCat==="all"?CATS:CATS.filter(c=>c.k===activeCat);
    cats.forEach(c=>{
      const arr=p.d[c.k]||[];
      html+=`<div class="grp ${c.cls}"><h3>${c.label}</h3>`;
      html+=arr.length?`<div class="items">${arr.map(raw=>{
        const n=nm(raw);const on=curItem&&curItem.cat===c.k&&curItem.name===n;
        return `<button class="item${nt(raw)?" hasnote":""}${on?" on":""}" data-cat="${c.k}" data-nm="${esc(n)}">${esc(n)}</button>`;
      }).join("")}</div>`:`<div class="empty">掲載なし</div>`;
      html+=`</div>`;
    });
    html+=`<div class="done"><span>この県は覚えた？</span><button id="doneBtn" aria-pressed="${!!progress[p.n]}">${progress[p.n]?"✓ 覚えた":"チェックする"}</button></div>`;
  }
  html+=`</div>`;
  el.innerHTML=html;

  el.querySelectorAll(".item").forEach(b=>b.addEventListener("click",()=>{
    const it=ITEMS.find(x=>x.cat===b.dataset.cat&&x.name===b.dataset.nm);
    if(!it)return;
    if(curItem&&curItem.name===it.name&&curItem.cat===it.cat){curItem=null;highlight=null;paintMap();renderPanel();}
    else setItem(it);
  }));
  el.querySelectorAll("[data-pref]").forEach(b=>b.addEventListener("click",()=>{
    selected=NAME2I[b.dataset.pref];curItem=null;highlight=null;paintMap();renderPanel();
    mapbox.scrollIntoView({behavior:"smooth",block:"nearest"});
  }));
  el.querySelectorAll("[data-jump]").forEach(b=>b.addEventListener("click",()=>{
    const t=findItem(b.dataset.jump);
    if(t){selected=t.prefs[0];setItem(t);}
  }));
  const db=document.getElementById("doneBtn");
  if(db)db.addEventListener("click",()=>{progress[PREFS[selected].n]=!progress[PREFS[selected].n];saveProgress();renderPanel();paintMap();});
  loadThumbs(el);
}
document.getElementById("photo").addEventListener("change",()=>renderPanel());

buildMap(mapbox,i=>{selected=i;curItem=null;highlight=null;paintMap();renderPanel();});
buildChips();buildRegChips();paintMap();

document.getElementById("search").addEventListener("input",e=>{
  const q=e.target.value.trim();
  if(!q){highlight=null;curItem=null;paintMap();renderPanel();return;}
  const uq=q.toUpperCase();
  const gHit=GROUPS.filter(g=>g[0].includes(q));
  let hits=ITEMS.filter(it=>it.name.includes(q)||bare(it.name).includes(q)||it.note.includes(q)||it.note.toUpperCase().includes(uq));
  if(gHit.length){gHit.forEach(g=>g[1].forEach(mn=>{const t=findItem(mn);if(t&&!hits.includes(t))hits.push(t);}));}
  const prefHit=PREFS.filter(p=>p.n.includes(q)).map(p=>p.i);
  const prefs=[...new Set([...hits.flatMap(h=>h.prefs),...prefHit])];
  highlight={prefs,label:gHit.length?gHit[0][0]:(hits.length?hits.slice(0,3).map(h=>h.name).join("／")+(hits.length>3?` ほか${hits.length-3}`:""):q+"（該当なし）")};
  selected=null;curItem=hits.length===1?hits[0]:null;
  paintMap();renderPanel();
});

/* ---------- クイズ ---------- */
const quizState={cat:"all",q:null,answered:false,ok:0,all:0};
const qchips=document.getElementById("qchips");
function buildQChips(){
  qchips.innerHTML="";
  const mk=(k,label,cls)=>{
    const b=document.createElement("button");b.className="chip "+(cls||"");
    b.setAttribute("aria-pressed",quizState.cat===k);
    b.innerHTML=(cls?'<span class="dot"></span>':'')+label;
    b.addEventListener("click",()=>{quizState.cat=k;buildQChips();nextQuestion();});
    qchips.appendChild(b);
  };
  mk("all","全分野","");CATS.forEach(c=>mk(c.k,c.label,c.cls));
}
buildQChips();buildMap(qmapbox,i=>answerMap(i));
const pool=()=>ITEMS.filter(it=>quizState.cat==="all"||it.cat===quizState.cat);
const pick=a=>a[Math.floor(Math.random()*a.length)];

function nextQuestion(){
  const it=pick(pool());
  const type=Math.random()<.55?"map":"choice";
  quizState.q={it,type};quizState.answered=false;
  document.getElementById("qfeedback").innerHTML="";
  document.getElementById("qchoices").innerHTML="";
  [...qmapbox.children].forEach(b=>{b.className="pref";b.style.background="#fff";b.style.color="var(--sumi)";b.style.borderColor="var(--line)";});
  document.getElementById("qmeta").textContent=CATMAP[it.cat].label+"　"+(type==="map"?"地図で答える":"4択");
  if(type==="map"){
    qmapbox.classList.remove("hidden");
    document.getElementById("qtext").textContent=`「${it.name}」があるのは？`;
    document.getElementById("qhint").textContent="地図から都道府県をタップ";
  }else{
    qmapbox.classList.add("hidden");
    const p=PREFS[pick(it.prefs)];quizState.q.pref=p;
    document.getElementById("qtext").textContent=`${p.n}の「${CATMAP[it.cat].label}」はどれ？`;
    document.getElementById("qhint").textContent="";
    const wrongs=ITEMS.filter(x=>x.cat===it.cat&&!x.prefs.includes(p.i));
    const opts=[it.name];let guard=0;
    while(opts.length<4&&wrongs.length&&guard++<60){const w=pick(wrongs).name;if(!opts.includes(w))opts.push(w);}
    opts.sort(()=>Math.random()-.5);
    const qc=document.getElementById("qchoices");
    opts.forEach(o=>{const b=document.createElement("button");b.textContent=o;b.addEventListener("click",()=>answerChoice(b,o,it));qc.appendChild(b);});
  }
}
function scoreUp(ok){
  quizState.all++;if(ok)quizState.ok++;
  document.getElementById("sOk").textContent=quizState.ok;
  document.getElementById("sAll").textContent=quizState.all;
  document.getElementById("sPct").textContent=Math.round(quizState.ok/quizState.all*100)+"%";
}
function answerMap(i){
  if(quizState.answered||quizState.q.type!=="map")return;
  quizState.answered=true;
  const it=quizState.q.it,ok=it.prefs.includes(i);
  [...qmapbox.children].forEach(b=>{
    const pi=+b.dataset.i;
    if(it.prefs.includes(pi))b.classList.add("right");else if(pi===i)b.classList.add("wrong");
  });
  scoreUp(ok);showFeedback(ok,it);
}
function answerChoice(btn,o,it){
  if(quizState.answered)return;quizState.answered=true;
  const ok=(o===it.name);
  [...document.getElementById("qchoices").children].forEach(b=>{
    if(b.textContent===it.name)b.classList.add("right");else if(b===btn&&!ok)b.classList.add("wrong");
  });
  scoreUp(ok);showFeedback(ok,it);
}
function showFeedback(ok,it){
  const names=it.prefs.map(i=>PREFS[i].n).join("・");
  const p0=PREFS[it.prefs[0]];
  const gs=groupsOf(it.name);
  const chain=CATS.filter(c=>c.k!==it.cat).map(c=>{
    const a=(p0.d[c.k]||[]).slice(0,2).map(nm);return a.length?`${c.label}：${a.join("・")}`:null;
  }).filter(Boolean).slice(0,4).join("　／　");
  const fb=document.getElementById("qfeedback");
  fb.innerHTML=
   `<div class="feedback" style="border-color:${ok?'var(--ok)':'var(--ng)'}">
     <b>${ok?"正解":"不正解"}</b>　${esc(it.name)} → <b>${names}</b>
     ${it.note?`<div class="fnote">${esc(it.note)}</div>`:""}
     <figure class="dimg loading" data-thumb="${esc(wikiTitle(it))}" data-q="${encodeURIComponent(bare(it.name)+" "+p0.n)}">読み込み中…</figure>
     ${gs.length?`<div class="fnote" style="color:var(--ai)">${gs.map(g=>"〈"+esc(g)+"〉").join(" ")}　${esc(GROUPS.find(x=>x[0]===gs[0])[1].join("・"))}</div>`:""}
     <div class="fchain">${p0.n}の周辺　${esc(chain)}</div>
   </div>`;
  loadThumbs(fb);
}
document.getElementById("qnext").addEventListener("click",nextQuestion);
document.getElementById("qreset").addEventListener("click",()=>{
  quizState.ok=0;quizState.all=0;
  document.getElementById("sOk").textContent=0;document.getElementById("sAll").textContent=0;
  document.getElementById("sPct").textContent="—";nextQuestion();
});

/* ---------- 横断まとめ ---------- */
let listBuilt=false;
function jumpTo(names,label){
  highlight={prefs:names.map(n=>NAME2I[n]).filter(v=>v!==undefined),label};
  selected=null;curItem=null;
  document.querySelector('.tabs button[data-tab="map"]').click();
  paintMap();renderPanel();
  mapbox.scrollIntoView({behavior:"smooth",block:"center"});
}
const prefsFromText=t=>PREFS.map(p=>p.n).filter(n=>t.includes(n));
function buildList(){
  listBuilt=true;let h="";
  h+=`<div class="section"><h2>国立公園 35</h2><div class="note">北→南の公式順。2024年に日高山脈襟裳十勝が加わり35か所（ほかに国定公園57）。</div>`;
  PARKS.forEach((n,i)=>h+=`<div class="row" data-pf="${esc(PARK_PREF[n])}" data-lb="${esc(n+'国立公園')}"><span class="num">${String(i+1).padStart(2,"0")}</span><span>${esc(n)}</span><span class="pf">${esc(PARK_PREF[n])}</span></div>`);
  h+=`</div><div class="section"><h2>世界自然遺産 5</h2>`;
  WHS_NAT.forEach((r,i)=>h+=`<div class="row" data-pf="${esc(r[1])}" data-lb="${esc(r[0])}"><span class="num">自${i+1}</span><span>${esc(r[0])}</span><span class="pf">${esc(r[1])}</span></div>`);
  h+=`</div><div class="section"><h2>世界文化遺産 21</h2><div class="note">登録年順。自然5と合わせて計26。</div>`;
  WHS_CUL.forEach((r,i)=>h+=`<div class="row" data-pf="${esc(r[1])}" data-lb="${esc(r[0])}"><span class="num">${String(i+1).padStart(2,"0")}</span><span>${esc(r[0])}</span><span class="pf">${esc(r[1])}</span></div>`);
  h+=`</div><div class="section"><h2>「三大◯◯」総ざらい</h2><div class="note">タップすると該当県が地図に出ます。</div>`;
  TRIOS.forEach(t=>h+=`<div class="trio" data-pf="${esc(t[1])}" data-lb="${esc(t[0])}"><h3>${esc(t[0])}</h3><p>${esc(t[1])}</p>${t[2]?`<div class="tip">${esc(t[2])}</div>`:""}</div>`);
  h+=`</div><div class="section"><h2>空港コード</h2><div class="note">3レターコード。定期便のある主要空港。</div>`;
  ITEMS.filter(i=>i.cat==="a").sort((a,b)=>a.note.localeCompare(b.note)).forEach(it=>{
    const code=(it.note.match(/[A-Z]{3}/)||[""])[0];
    h+=`<div class="row" data-pf="${esc(it.prefs.map(i=>PREFS[i].n).join("・"))}" data-lb="${esc(it.name)}"><span class="num">${esc(code)}</span><span>${esc(it.name)}</span><span class="pf">${esc(it.prefs.map(i=>PREFS[i].n).join("・"))}</span></div>`;
  });
  h+=`</div>`;
  const el=document.getElementById("listbody");el.innerHTML=h;
  el.querySelectorAll("[data-pf]").forEach(r=>{
    r.style.cursor="pointer";
    r.addEventListener("click",()=>{
      const names=prefsFromText(r.dataset.pf);
      jumpTo(names.length?names:prefsFromText(r.dataset.lb),r.dataset.lb);
    });
  });
}

/* ---------- 進捗（Claude内はwindow.storage、外部ホスティングでは端末に保存） ---------- */
const KEY="chiri-progress";
async function loadProgress(){
  try{
    if(window.storage){const r=await window.storage.get(KEY);if(r&&r.value)progress=JSON.parse(r.value);}
    else{const v=window.localStorage.getItem(KEY);if(v)progress=JSON.parse(v);}
  }catch(e){progress={};}
  paintMap();
}
async function saveProgress(){
  try{
    if(window.storage)await window.storage.set(KEY,JSON.stringify(progress));
    else window.localStorage.setItem(KEY,JSON.stringify(progress));
  }catch(e){}
}
loadProgress();
</script>
