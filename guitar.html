<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0d0d0d">
<title>Guitar Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d0d;
  --surface: #1a1a1a;
  --surface2: #252525;
  --border: #2e2e2e;
  --text: #f0f0f0;
  --dim: #888;
  --accent: #ff6b35;
  --accent-bg: rgba(255,107,53,0.12);
  --ok: #4caf50;
  --ok-bg: rgba(76,175,80,0.12);
  --err: #f44336;
  --err-bg: rgba(244,67,54,0.12);
  --blue: #64b5f6;
  --blue-bg: rgba(100,181,246,0.12);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }

.screen { position: fixed; inset: 0; display: flex; flex-direction: column; }
.screen.off { display: none; }
.hidden { display: none !important; }

/* ─── HOME ─── */
#home { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.home-top { padding: max(56px, env(safe-area-inset-top)) 24px 24px; text-align: center; }
.home-top h1 { font-size: 30px; font-weight: 800; letter-spacing: -1px; }
.home-top h1 em { color: var(--accent); font-style: normal; }
.home-top p { margin-top: 6px; font-size: 14px; color: var(--dim); }

.cards { padding: 0 14px 40px; display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 18px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: transform .12s, background .12s; }
.card:active { transform: scale(0.97); background: var(--surface2); }
.card-icon { width: 54px; height: 54px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; }
.card:nth-child(1) .card-icon { background: var(--accent-bg); }
.card:nth-child(2) .card-icon { background: var(--blue-bg); }
.card:nth-child(3) .card-icon { background: var(--ok-bg); }
.card-info { flex: 1; }
.card-title { font-size: 17px; font-weight: 700; }
.card-desc { font-size: 12px; color: var(--dim); margin-top: 3px; line-height: 1.5; }
.card-stat { text-align: right; }
.card-stat-label { font-size: 10px; color: var(--dim); }
.card-stat-val { font-size: 24px; font-weight: 800; color: var(--accent); }

/* ─── TRAINING HEADER ─── */
.t-header { padding: max(16px, env(safe-area-inset-top)) 14px 10px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.back { width: 42px; height: 42px; border-radius: 13px; background: var(--surface); border: none; color: var(--text); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.back:active { background: var(--surface2); }
.t-title { flex: 1; font-size: 16px; font-weight: 700; }
.streak { background: var(--accent-bg); border: 1px solid var(--accent); border-radius: 20px; padding: 4px 11px; font-size: 13px; font-weight: 800; color: var(--accent); white-space: nowrap; }

/* ─── SCORE BAR ─── */
.sbar { padding: 10px 14px max(10px, env(safe-area-inset-bottom)); display: flex; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; gap: 0; }
.si { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.sl { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; }
.sv { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }

/* ─── BIG PLAY BUTTON ─── */
.play-ring { width: 110px; height: 110px; border-radius: 55px; background: var(--accent); box-shadow: 0 6px 28px rgba(255,107,53,.45); border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: transform .1s, box-shadow .1s; flex-shrink: 0; }
.play-ring:active { transform: scale(0.91); box-shadow: none; }
.play-ring .pi { font-size: 38px; }
.play-ring .pl { font-size: 10px; font-weight: 800; color: rgba(255,255,255,.85); letter-spacing: 1.5px; }
.play-ring.playing { animation: ripple .4s ease-out; }
@keyframes ripple { 0%{box-shadow:0 0 0 0 rgba(255,107,53,.7)} 100%{box-shadow:0 0 0 20px rgba(255,107,53,0)} }

/* ─── NOTE MODE ─── */
#note-screen { background: var(--bg); }
.n-diff { padding: 0 14px 8px; display: flex; gap: 6px; flex-shrink: 0; }
.d-btn { flex: 1; height: 32px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--dim); font-size: 11px; font-weight: 600; cursor: pointer; transition: all .12s; }
.d-btn.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
.n-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 10px 16px; }
.n-feedback { text-align: center; min-height: 88px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.n-note { font-size: 72px; font-weight: 800; letter-spacing: -2px; line-height: 1; color: var(--dim); }
.n-verdict { font-size: 15px; font-weight: 700; margin-top: 4px; }
.n-feedback.ok .n-note, .n-feedback.ok .n-verdict { color: var(--ok); }
.n-feedback.ng .n-note, .n-feedback.ng .n-verdict { color: var(--err); }

.n-btns { width: 100%; padding: 0 10px; flex-shrink: 0; }
.n-grid { display: grid; grid-template-columns: repeat(6,1fr); gap: 7px; margin-bottom: 8px; }
.nb { height: 50px; border-radius: 13px; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 14px; font-weight: 800; cursor: pointer; transition: all .1s; display: flex; align-items: center; justify-content: center; }
.nb:active { transform: scale(0.91); }
.nb.sharp { font-size: 12px; color: var(--dim); }
.nb.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.nb.ng { background: var(--err-bg); border-color: var(--err); color: var(--err); }
.nb:disabled { opacity: .6; pointer-events: none; }

.voice-btn { width: 100%; height: 46px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all .15s; }
.voice-btn.on { background: var(--err-bg); border-color: var(--err); color: var(--err); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }

/* ─── FRETBOARD MODE ─── */
#fret-screen { background: var(--bg); }
.fb-toggle { padding: 0 14px 8px; display: flex; gap: 8px; flex-shrink: 0; }
.ft-btn { flex: 1; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--dim); font-size: 12px; font-weight: 600; cursor: pointer; transition: all .12s; }
.ft-btn.on { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); }
.fb-main { flex: 1; display: flex; flex-direction: column; padding: 6px 10px; gap: 10px; overflow: hidden; }
.fb-q { text-align: center; flex-shrink: 0; }
.fb-q-label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
.fb-q-note { font-size: 52px; font-weight: 800; color: var(--blue); line-height: 1.1; }
.fb-q-note.pos { font-size: 26px; color: var(--dim); }
.fb-wrap { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; }

/* fretboard table */
.fb-table { border-collapse: collapse; width: 100%; }
.fnum { width: 26px; height: 22px; text-align: center; font-size: 9px; color: #555; font-weight: 700; }
.slbl { width: 26px; text-align: center; font-size: 10px; color: #555; font-weight: 700; }
.fc { width: 28px; height: 38px; text-align: center; vertical-align: middle; position: relative; cursor: pointer; }
.fc:active { background: rgba(255,255,255,.04); }
.fdot { width: 26px; height: 26px; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 900; background: transparent; transition: background .12s, color .12s; }
.fdot.idle { background: #1e1e1e; }
.fdot.target { background: var(--blue); color: #fff; animation: pop .25s ease-out; }
.fdot.ok { background: var(--ok); color: #fff; }
.fdot.ok-dim { background: #2e7d32; color: rgba(255,255,255,.7); }
.fdot.ng { background: var(--err); color: #fff; }
@keyframes pop { 0%{transform:scale(0)} 70%{transform:scale(1.25)} 100%{transform:scale(1)} }

.mark { position: absolute; bottom: 1px; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; border-radius: 50%; background: #3a3a3a; pointer-events: none; }

/* note answer grid for fretboard mode */
.fb-note-grid { display: grid; grid-template-columns: repeat(6,1fr); gap: 6px; padding: 6px 10px; flex-shrink: 0; }
.fna-btn { height: 44px; border-radius: 11px; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 13px; font-weight: 800; cursor: pointer; transition: all .1s; }
.fna-btn:active { transform: scale(0.91); }
.fna-btn.sharp { font-size: 11px; color: var(--dim); }
.fna-btn.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.fna-btn.ng { background: var(--err-bg); border-color: var(--err); color: var(--err); }

/* ─── CHORD MODE ─── */
#chord-screen { background: var(--bg); }
.ch-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 16px; gap: 16px; }
.ch-q { text-align: center; }
.ch-q-label { font-size: 14px; color: var(--dim); min-height: 20px; }
.ch-root { font-size: 62px; font-weight: 800; line-height: 1; color: var(--text); }
.ch-btns { width: 100%; padding: 6px 12px; flex-shrink: 0; }
.ch-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
.cb { height: 56px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 15px; font-weight: 700; cursor: pointer; transition: all .1s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.cb .cja { font-size: 15px; }
.cb .cen { font-size: 10px; color: var(--dim); }
.cb:active { transform: scale(0.96); }
.cb.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.cb.ok .cen { color: var(--ok); }
.cb.ng { background: var(--err-bg); border-color: var(--err); color: var(--err); }
.cb.ng .cen { color: var(--err); }
</style>
</head>
<body>

<!-- ════ HOME ════ -->
<div id="home" class="screen">
  <div class="home-top">
    <h1>Guitar <em>Trainer</em></h1>
    <p>耳コピマスターへの道</p>
  </div>
  <div class="cards">
    <div class="card" onclick="go('note')">
      <div class="card-icon">🎵</div>
      <div class="card-info">
        <div class="card-title">音名トレーニング</div>
        <div class="card-desc">音を聴いて音名を当てる<br>絶対音感・相対音感を鍛える</div>
      </div>
      <div class="card-stat">
        <div class="card-stat-label">最高連続</div>
        <div class="card-stat-val" id="h-note">—</div>
      </div>
    </div>
    <div class="card" onclick="go('fret')">
      <div class="card-icon">🎸</div>
      <div class="card-info">
        <div class="card-title">指板トレーニング</div>
        <div class="card-desc">指板上の全ての音の位置を<br>完璧に覚える</div>
      </div>
      <div class="card-stat">
        <div class="card-stat-label">最高連続</div>
        <div class="card-stat-val" id="h-fret">—</div>
      </div>
    </div>
    <div class="card" onclick="go('chord')">
      <div class="card-icon">🎼</div>
      <div class="card-info">
        <div class="card-title">コードトレーニング</div>
        <div class="card-desc">コードの響きを聴いて<br>種類を当てる</div>
      </div>
      <div class="card-stat">
        <div class="card-stat-label">最高連続</div>
        <div class="card-stat-val" id="h-chord">—</div>
      </div>
    </div>
  </div>
</div>

<!-- ════ NOTE SCREEN ════ -->
<div id="note-screen" class="screen off">
  <div class="t-header">
    <button class="back" onclick="home()">←</button>
    <span class="t-title">🎵 音名トレーニング</span>
    <div class="streak">🔥 <span id="ns-streak">0</span></div>
  </div>
  <div class="n-diff">
    <button class="d-btn on" id="dn-nat" onclick="setDiff('nat')">自然音のみ</button>
    <button class="d-btn" id="dn-all" onclick="setDiff('all')">全12音</button>
  </div>
  <div class="n-main">
    <button class="play-ring" id="n-play" onclick="replayNote()">
      <span class="pi">▶</span>
      <span class="pl">PLAY</span>
    </button>
    <div class="n-feedback" id="n-fb">
      <div class="n-note" id="n-note">?</div>
      <div class="n-verdict" id="n-verdict"></div>
    </div>
  </div>
  <div class="n-btns">
    <div class="n-grid" id="n-row1"></div>
    <div class="n-grid" id="n-row2"></div>
    <button class="voice-btn" id="voice-btn" onclick="toggleVoice()">🎤 声で答える</button>
  </div>
  <div class="sbar">
    <div class="si"><span class="sl">正解</span><span class="sv" id="ns-ok">0</span></div>
    <div class="si"><span class="sl">問題数</span><span class="sv" id="ns-tot">0</span></div>
    <div class="si"><span class="sl">正答率</span><span class="sv" id="ns-pct">—</span></div>
    <div class="si"><span class="sl">連続</span><span class="sv" id="ns-str2">0</span></div>
  </div>
</div>

<!-- ════ FRETBOARD SCREEN ════ -->
<div id="fret-screen" class="screen off">
  <div class="t-header">
    <button class="back" onclick="home()">←</button>
    <span class="t-title">🎸 指板トレーニング</span>
    <div class="streak">🔥 <span id="fs-streak">0</span></div>
  </div>
  <div class="fb-toggle">
    <button class="ft-btn on" id="ft-find" onclick="setFbMode('find')">音名 → 場所を探す</button>
    <button class="ft-btn" id="ft-name" onclick="setFbMode('name')">場所 → 音名を答える</button>
  </div>
  <div class="fb-main">
    <div class="fb-q">
      <div class="fb-q-label" id="fb-label">この音の場所をタップ</div>
      <div class="fb-q-note" id="fb-note">E</div>
    </div>
    <div class="fb-wrap" id="fb-wrap"></div>
    <div id="fb-note-area" class="hidden">
      <div class="fb-note-grid" id="fb-note-grid"></div>
    </div>
  </div>
  <div class="sbar">
    <div class="si"><span class="sl">正解</span><span class="sv" id="fs-ok">0</span></div>
    <div class="si"><span class="sl">問題数</span><span class="sv" id="fs-tot">0</span></div>
    <div class="si"><span class="sl">正答率</span><span class="sv" id="fs-pct">—</span></div>
    <div class="si"><span class="sl">連続</span><span class="sv" id="fs-str2">0</span></div>
  </div>
</div>

<!-- ════ CHORD SCREEN ════ -->
<div id="chord-screen" class="screen off">
  <div class="t-header">
    <button class="back" onclick="home()">←</button>
    <span class="t-title">🎼 コードトレーニング</span>
    <div class="streak">🔥 <span id="cs-streak">0</span></div>
  </div>
  <div class="ch-main">
    <button class="play-ring" id="ch-play" onclick="replayChord()">
      <span class="pi">▶</span>
      <span class="pl">PLAY</span>
    </button>
    <div class="ch-q">
      <div class="ch-q-label" id="ch-label">コードの種類を選んでください</div>
      <div class="ch-root" id="ch-root">?</div>
    </div>
  </div>
  <div class="ch-btns">
    <div class="ch-grid" id="ch-grid"></div>
  </div>
  <div class="sbar">
    <div class="si"><span class="sl">正解</span><span class="sv" id="cs-ok">0</span></div>
    <div class="si"><span class="sl">問題数</span><span class="sv" id="cs-tot">0</span></div>
    <div class="si"><span class="sl">正答率</span><span class="sv" id="cs-pct">—</span></div>
    <div class="si"><span class="sl">連続</span><span class="sv" id="cs-str2">0</span></div>
  </div>
</div>

<script>
'use strict';
// ═══════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════
const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NATURAL = ['C','D','E','F','G','A','B'];

// Strings displayed top(high)→bottom(low): E4 B3 G3 D3 A2 E2
const STR_MIDI = [64, 59, 55, 50, 45, 40];
const STR_NAME = ['1E','2B','3G','4D','5A','6E'];
const NUM_FRETS = 12;
const FRET_DOTS = [3,5,7,9,12];

const CHORD_TYPES = [
  { id:'maj',  ja:'メジャー',        en:'Major',   intervals:[0,4,7] },
  { id:'min',  ja:'マイナー',        en:'Minor',   intervals:[0,3,7] },
  { id:'dom7', ja:'ドミナント7',     en:'Dom 7',   intervals:[0,4,7,10] },
  { id:'min7', ja:'マイナー7',       en:'Min 7',   intervals:[0,3,7,10] },
  { id:'maj7', ja:'メジャー7',       en:'Maj 7',   intervals:[0,4,7,11] },
  { id:'dim',  ja:'ディミニッシュ',  en:'Dim',     intervals:[0,3,6] },
  { id:'aug',  ja:'オーギュメント',  en:'Aug',     intervals:[0,4,8] },
  { id:'sus4', ja:'サスフォー',      en:'Sus4',    intervals:[0,5,7] },
];

// ═══════════════════════════════════════════════
// AUDIO ENGINE
// ═══════════════════════════════════════════════
let AC = null;
function ac() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function freq(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }

function pluck(midi, vel=0.7, dur=2.5) {
  const ctx = ac();
  const t = ctx.currentTime;
  const f = freq(midi);

  const master = ctx.createGain();
  master.gain.setValueAtTime(vel * 0.13, t);
  master.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  const filt = ctx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.value = Math.min(f * 7, 7000);
  filt.Q.value = 0.8;
  master.connect(filt);
  filt.connect(ctx.destination);

  // Harmonics with faster decay for higher partials (plucked string model)
  [1,2,3,4,5,6,7].forEach((h, i) => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    const decay = dur / (1 + i * 0.55);
    const amps = [1,.65,.38,.22,.13,.07,.04];
    osc.type = 'sine';
    osc.frequency.value = f * h;
    g.gain.setValueAtTime(amps[i], t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    osc.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + decay + 0.05);
  });
}

function strum(midis, arpeggiate=true) {
  midis.forEach((m, i) => {
    setTimeout(() => pluck(m, 0.58, 2.2), arpeggiate ? i * 65 : 0);
  });
}

// ═══════════════════════════════════════════════
// PERSISTENCE
// ═══════════════════════════════════════════════
let bests = { note:0, fret:0, chord:0 };
function loadBests() {
  try { const s = localStorage.getItem('gt_bests'); if(s) bests = JSON.parse(s); } catch(e) {}
  refreshHome();
}
function saveBest(mode, val) {
  if (val > bests[mode]) { bests[mode] = val; try { localStorage.setItem('gt_bests', JSON.stringify(bests)); } catch(e) {} refreshHome(); }
}
function refreshHome() {
  const show = v => v > 0 ? String(v) : '—';
  document.getElementById('h-note').textContent  = show(bests.note);
  document.getElementById('h-fret').textContent  = show(bests.fret);
  document.getElementById('h-chord').textContent = show(bests.chord);
}

// ═══════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.add('off')); document.getElementById(id).classList.remove('off'); }
function home() { stopVoice(); show('home'); refreshHome(); }
function go(mode) {
  if (mode === 'note')  { initNote();  show('note-screen'); }
  if (mode === 'fret')  { initFret();  show('fret-screen'); }
  if (mode === 'chord') { initChord(); show('chord-screen'); }
}

// ═══════════════════════════════════════════════
// SHARED LOCK (prevents rapid double answers)
// ═══════════════════════════════════════════════
let locked = false;
function lock(ms) { locked = true; setTimeout(() => locked = false, ms); }

// ═══════════════════════════════════════════════
// NOTE MODE
// ═══════════════════════════════════════════════
let noteDiff = 'nat';
let noteScore = { ok:0, tot:0, str:0 };
let noteMidi = null;
let noteAns  = null;

function initNote() {
  noteScore = { ok:0, tot:0, str:0 };
  buildNoteButtons();
  nextNote();
}

function buildNoteButtons() {
  const r1 = document.getElementById('n-row1');
  const r2 = document.getElementById('n-row2');
  r1.innerHTML = r2.innerHTML = '';
  ['C','C#','D','D#','E','F'].forEach(n => r1.appendChild(noteBtn(n)));
  ['F#','G','G#','A','A#','B'].forEach(n => r2.appendChild(noteBtn(n)));
}

function noteBtn(n) {
  const b = document.createElement('button');
  b.className = 'nb' + (n.includes('#') ? ' sharp' : '');
  b.id = 'nb-' + n.replace('#','s');
  b.textContent = n;
  b.addEventListener('click', () => ansNote(n));
  return b;
}

function setDiff(d) {
  noteDiff = d;
  document.getElementById('dn-nat').classList.toggle('on', d==='nat');
  document.getElementById('dn-all').classList.toggle('on', d==='all');
  nextNote();
}

function nextNote() {
  locked = false;
  document.getElementById('n-fb').className = 'n-feedback';
  document.getElementById('n-note').textContent = '?';
  document.getElementById('n-verdict').textContent = '';
  document.querySelectorAll('.nb').forEach(b => { b.classList.remove('ok','ng'); b.disabled = false; });

  const pool = [];
  for (let m = 40; m <= 64; m++) {
    const name = NOTES[((m%12)+12)%12];
    if (noteDiff === 'nat' && !NATURAL.includes(name)) continue;
    pool.push(m);
  }
  noteMidi = pool[Math.floor(Math.random() * pool.length)];
  noteAns  = NOTES[((noteMidi%12)+12)%12];
  setTimeout(() => replayNote(), 150);
}

function replayNote() { if(noteMidi) pluck(noteMidi); }

function ansNote(n) {
  if (locked) return;
  lock(1300);
  noteScore.tot++;
  const ok = n === noteAns;

  if (ok) {
    noteScore.ok++;  noteScore.str++;
    saveBest('note', noteScore.str);
    document.getElementById('n-fb').className = 'n-feedback ok';
    document.getElementById('n-note').textContent = noteAns;
    document.getElementById('n-verdict').textContent = '✓ 正解！';
    document.getElementById('nb-' + n.replace('#','s')).classList.add('ok');
  } else {
    noteScore.str = 0;
    document.getElementById('n-fb').className = 'n-feedback ng';
    document.getElementById('n-note').textContent = noteAns;
    document.getElementById('n-verdict').textContent = `✗ 正解は ${noteAns}`;
    document.getElementById('nb-' + n.replace('#','s')).classList.add('ng');
    document.getElementById('nb-' + noteAns.replace('#','s')).classList.add('ok');
    setTimeout(() => pluck(noteMidi), 350);
  }
  updateNoteScore();
  setTimeout(() => nextNote(), ok ? 900 : 1500);
}

function updateNoteScore() {
  const s = noteScore;
  document.getElementById('ns-ok').textContent   = s.ok;
  document.getElementById('ns-tot').textContent  = s.tot;
  document.getElementById('ns-pct').textContent  = s.tot ? Math.round(s.ok/s.tot*100)+'%' : '—';
  document.getElementById('ns-streak').textContent = document.getElementById('ns-str2').textContent = s.str;
}

// ═══════════════════════════════════════════════
// FRETBOARD MODE
// ═══════════════════════════════════════════════
let fbMode = 'find';
let fretScore = { ok:0, tot:0, str:0 };
let fretQ = null; // { si, fret, midi, note }

function initFret() {
  fretScore = { ok:0, tot:0, str:0 };
  fbMode = 'find';
  document.getElementById('ft-find').classList.add('on');
  document.getElementById('ft-name').classList.remove('on');
  document.getElementById('fb-note-area').classList.add('hidden');
  buildFretboard();
  buildFretNoteButtons();
  nextFret();
}

function buildFretboard() {
  const wrap = document.getElementById('fb-wrap');
  wrap.innerHTML = '';
  const tbl = document.createElement('table');
  tbl.className = 'fb-table';

  // fret number header
  const hrow = document.createElement('tr');
  const lh = document.createElement('td'); lh.className = 'fnum'; hrow.appendChild(lh);
  for (let f = 0; f <= NUM_FRETS; f++) {
    const th = document.createElement('td'); th.className = 'fnum'; th.textContent = f; hrow.appendChild(th);
  }
  tbl.appendChild(hrow);

  // string rows
  for (let si = 0; si < 6; si++) {
    const row = document.createElement('tr');
    const lbl = document.createElement('td'); lbl.className = 'slbl'; lbl.textContent = STR_NAME[si]; row.appendChild(lbl);

    for (let f = 0; f <= NUM_FRETS; f++) {
      const midi = STR_MIDI[si] + f;
      const note = NOTES[((midi%12)+12)%12];
      const td = document.createElement('td');
      td.className = 'fc';
      td.style.borderLeft = f === 0 ? '3px solid #444' : '1px solid #222';
      td.style.borderBottom = si < 5 ? '1px solid #222' : 'none';

      // fret marker dots (on string index 2 = G string)
      if (FRET_DOTS.includes(f) && si === 2) {
        const m = document.createElement('div'); m.className = 'mark'; td.appendChild(m);
      }
      // double dots at 12th (string 1 and 3)
      if (f === 12 && (si === 1 || si === 3)) {
        const m = document.createElement('div'); m.className = 'mark'; td.appendChild(m);
      }

      const dot = document.createElement('div');
      dot.className = 'fdot idle';
      dot.id = `fd-${si}-${f}`;
      dot.dataset.si = si; dot.dataset.f = f; dot.dataset.note = note; dot.dataset.midi = midi;
      td.appendChild(dot);

      td.addEventListener('click', () => handleFretClick(si, f, midi, note));
      row.appendChild(td);
    }
    tbl.appendChild(row);
  }
  const outer = document.createElement('div'); outer.style.padding = '4px 8px'; outer.appendChild(tbl);
  wrap.appendChild(outer);
}

function buildFretNoteButtons() {
  const grid = document.getElementById('fb-note-grid');
  grid.innerHTML = '';
  NOTES.forEach(n => {
    const b = document.createElement('button');
    b.className = 'fna-btn' + (n.includes('#') ? ' sharp' : '');
    b.id = 'fna-' + n.replace('#','s');
    b.textContent = n;
    b.addEventListener('click', () => ansFretName(n));
    grid.appendChild(b);
  });
}

function setFbMode(m) {
  fbMode = m;
  document.getElementById('ft-find').classList.toggle('on', m==='find');
  document.getElementById('ft-name').classList.toggle('on', m==='name');
  document.getElementById('fb-note-area').classList.toggle('hidden', m==='find');
  nextFret();
}

function nextFret() {
  locked = false;
  allDots(dot => { dot.className = 'fdot idle'; dot.textContent = ''; });
  document.querySelectorAll('.fna-btn').forEach(b => { b.classList.remove('ok','ng'); b.disabled = false; });

  const si   = Math.floor(Math.random() * 6);
  const f    = Math.floor(Math.random() * (NUM_FRETS + 1));
  const midi = STR_MIDI[si] + f;
  const note = NOTES[((midi%12)+12)%12];
  fretQ = { si, f, midi, note };

  if (fbMode === 'find') {
    document.getElementById('fb-label').textContent = 'この音の場所をタップ';
    const el = document.getElementById('fb-note');
    el.textContent = note; el.className = 'fb-q-note';
    setTimeout(() => pluck(midi), 200);
  } else {
    document.getElementById('fb-label').textContent = 'この位置の音名は？';
    const el = document.getElementById('fb-note');
    el.textContent = `${STR_NAME[si]} • ${f}フレット`; el.className = 'fb-q-note pos';
    const dot = document.getElementById(`fd-${si}-${f}`);
    if (dot) { dot.className = 'fdot target'; dot.textContent = '?'; }
    setTimeout(() => pluck(midi), 200);
  }
}

function handleFretClick(si, f, midi, note) {
  if (fbMode !== 'find') return;
  if (locked) return;
  lock(1600);
  fretScore.tot++;
  const ok = note === fretQ.note;

  if (ok) {
    fretScore.ok++; fretScore.str++;
    saveBest('fret', fretScore.str);
    setDot(si, f, 'ok', note);
    // show all other correct positions dimmer
    allDots(dot => {
      if (dot.dataset.note === fretQ.note && !(+dot.dataset.si===si && +dot.dataset.f===f)) {
        dot.className = 'fdot ok-dim'; dot.textContent = fretQ.note;
      }
    });
  } else {
    fretScore.str = 0;
    setDot(si, f, 'ng', note);
    // show all correct positions
    allDots(dot => {
      if (dot.dataset.note === fretQ.note) { dot.className = 'fdot ok'; dot.textContent = fretQ.note; }
    });
    setTimeout(() => pluck(fretQ.midi), 300);
  }
  updateFretScore();
  setTimeout(() => nextFret(), ok ? 1000 : 1700);
}

function ansFretName(n) {
  if (fbMode !== 'name') return;
  if (locked) return;
  lock(1500);
  fretScore.tot++;
  const ok = n === fretQ.note;
  const { si, f } = fretQ;

  if (ok) {
    fretScore.ok++; fretScore.str++;
    saveBest('fret', fretScore.str);
    setDot(si, f, 'ok', fretQ.note);
    document.getElementById('fna-' + n.replace('#','s')).classList.add('ok');
  } else {
    fretScore.str = 0;
    setDot(si, f, 'ok', fretQ.note);
    document.getElementById('fna-' + n.replace('#','s')).classList.add('ng');
    document.getElementById('fna-' + fretQ.note.replace('#','s')).classList.add('ok');
    setTimeout(() => pluck(fretQ.midi), 300);
  }
  updateFretScore();
  setTimeout(() => nextFret(), ok ? 1000 : 1700);
}

function setDot(si, f, cls, label) {
  const dot = document.getElementById(`fd-${si}-${f}`);
  if (dot) { dot.className = `fdot ${cls}`; dot.textContent = label; }
}
function allDots(fn) { document.querySelectorAll('.fdot').forEach(fn); }

function updateFretScore() {
  const s = fretScore;
  document.getElementById('fs-ok').textContent   = s.ok;
  document.getElementById('fs-tot').textContent  = s.tot;
  document.getElementById('fs-pct').textContent  = s.tot ? Math.round(s.ok/s.tot*100)+'%' : '—';
  document.getElementById('fs-streak').textContent = document.getElementById('fs-str2').textContent = s.str;
}

// ═══════════════════════════════════════════════
// CHORD MODE
// ═══════════════════════════════════════════════
let chordScore = { ok:0, tot:0, str:0 };
let chordCurrent = null; // { type, root, midis }

function initChord() {
  chordScore = { ok:0, tot:0, str:0 };
  buildChordButtons();
  nextChord();
}

function buildChordButtons() {
  const grid = document.getElementById('ch-grid');
  grid.innerHTML = '';
  CHORD_TYPES.forEach(ct => {
    const b = document.createElement('button');
    b.className = 'cb'; b.id = 'cb-' + ct.id;
    b.innerHTML = `<span class="cja">${ct.ja}</span><span class="cen">${ct.en}</span>`;
    b.addEventListener('click', () => ansChord(ct.id));
    grid.appendChild(b);
  });
}

function nextChord() {
  locked = false;
  document.querySelectorAll('.cb').forEach(b => { b.classList.remove('ok','ng'); b.disabled = false; });
  document.getElementById('ch-root').textContent = '?';
  document.getElementById('ch-root').style.fontSize = '62px';
  document.getElementById('ch-label').textContent = 'コードの種類を選んでください';

  const rootMidi = 48 + Math.floor(Math.random() * 12); // C3 range
  const root = NOTES[((rootMidi%12)+12)%12];
  const ct = CHORD_TYPES[Math.floor(Math.random() * CHORD_TYPES.length)];
  const midis = ct.intervals.map(i => rootMidi + i);
  chordCurrent = { type: ct.id, root, midis };

  setTimeout(() => replayChord(), 300);
}

function replayChord() {
  if (chordCurrent) strum(chordCurrent.midis);
  const btn = document.getElementById('ch-play');
  btn.classList.add('playing');
  setTimeout(() => btn.classList.remove('playing'), 500);
}

function ansChord(id) {
  if (locked) return;
  lock(1800);
  chordScore.tot++;
  const ok = id === chordCurrent.type;
  const correctCt = CHORD_TYPES.find(c => c.id === chordCurrent.type);

  document.getElementById('ch-root').textContent = chordCurrent.root;
  document.getElementById('ch-root').style.fontSize = '44px';

  if (ok) {
    chordScore.ok++; chordScore.str++;
    saveBest('chord', chordScore.str);
    document.getElementById('ch-label').textContent = `✓ 正解！${chordCurrent.root} ${correctCt.ja}`;
    document.getElementById('cb-' + id).classList.add('ok');
  } else {
    chordScore.str = 0;
    document.getElementById('ch-label').textContent = `✗ 正解は ${chordCurrent.root} ${correctCt.ja}`;
    document.getElementById('cb-' + id).classList.add('ng');
    document.getElementById('cb-' + chordCurrent.type).classList.add('ok');
    setTimeout(() => replayChord(), 400);
  }
  updateChordScore();
  setTimeout(() => nextChord(), ok ? 1100 : 2000);
}

function updateChordScore() {
  const s = chordScore;
  document.getElementById('cs-ok').textContent   = s.ok;
  document.getElementById('cs-tot').textContent  = s.tot;
  document.getElementById('cs-pct').textContent  = s.tot ? Math.round(s.ok/s.tot*100)+'%' : '—';
  document.getElementById('cs-streak').textContent = document.getElementById('cs-str2').textContent = s.str;
}

// ═══════════════════════════════════════════════
// VOICE RECOGNITION
// ═══════════════════════════════════════════════
let recog = null, recogOn = false;

function toggleVoice() { recogOn ? stopVoice() : startVoice(); }

function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('このブラウザは音声認識に対応していません'); return; }
  recog = new SR();
  recog.lang = 'ja-JP'; recog.continuous = true; recog.interimResults = false;
  recog.onresult = e => {
    const t = e.results[e.results.length-1][0].transcript.toLowerCase();
    const n = parseVoiceNote(t); if (n) ansNote(n);
  };
  recog.onerror = () => stopVoice();
  recog.onend   = () => { if (recogOn) recog.start(); };
  recog.start(); recogOn = true;
  const btn = document.getElementById('voice-btn');
  btn.classList.add('on'); btn.textContent = '🔴 聞いています… (タップで停止)';
}

function stopVoice() {
  if (recog) { recog.stop(); recog = null; }
  recogOn = false;
  const btn = document.getElementById('voice-btn');
  if (btn) { btn.classList.remove('on'); btn.textContent = '🎤 声で答える'; }
}

function parseVoiceNote(t) {
  const map = {
    'c':'C','シー':'C','ど':'C',
    'd':'D','ディー':'D','れ':'D',
    'e':'E','イー':'E','み':'E',
    'f':'F','エフ':'F','ふぁ':'F','ふぁー':'F',
    'g':'G','ジー':'G','そ':'G',
    'a':'A','えー':'A','ら':'A',
    'b':'B','ビー':'B','し':'B',
    'c sharp':'C#','cis':'C#','c#':'C#',
    'd sharp':'D#','dis':'D#','d#':'D#',
    'f sharp':'F#','fis':'F#','f#':'F#',
    'g sharp':'G#','gis':'G#','g#':'G#',
    'a sharp':'A#','ais':'A#','a#':'A#',
  };
  for (const [k,v] of Object.entries(map)) if (t.includes(k)) return v;
  return null;
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
loadBests();

// Prevent double-tap zoom on iOS
let lastTouch = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouch < 300) e.preventDefault();
  lastTouch = now;
}, { passive: false });
</script>
